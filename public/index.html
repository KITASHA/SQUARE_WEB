<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="岡山アカペラサークルSQUAREの公式サイトです。初心者・経験者を問わず、アカペラを楽しみたい人が集まるサークルです。">
  <title>岡山アカペラサークルSQUARE</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="/static/js/site.js" defer></script>
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <link rel="icon" href="/static/icons/favicon.ico">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#3f454b">
</head>
<body class="square-home">
  <div data-site-header></div>
  <main>
    <section class="sq-hero">
      <div class="sq-hero-copy">
        <p class="sq-eyebrow">Okayama A Cappella Circle</p>
        <h1>SQUARE</h1>
        <div class="sq-short-line" aria-hidden="true"></div>
        <p class="sq-lead">
          「誰でも入れるアカペラサークル」をコンセプトとして<br class="desktop-only">
          アカペラを始めたい人が集まってくる<br class="desktop-only">
          広場のようなサークルです。<br>
          初心者、経験者、とにかくだれもが気軽にアカペラを楽しめます。
        </p>
        <a class="sq-primary-button" href="/about"><span>SQUAREをもっと知る</span><span aria-hidden="true">→</span></a>
      </div>
      <div class="sq-hero-visual">
        <img src="/static/images/home/hero-01.jpg" alt="SQUAREのメンバー集合写真">
      </div>
    </section>

    <section class="sq-links" aria-label="SQUAREの主なコンテンツ">
      <a class="sq-link-card" href="/about">
        <img src="/static/images/common/square-logo.png" alt="SQUARE ロゴ">
        <span class="sq-card-title">SQUAREについて</span><span class="sq-card-arrow" aria-hidden="true">→</span>
      </a>
      <a class="sq-link-card" href="/session">
        <img src="/static/images/home/card-session.jpg" alt="定期活動会の様子">
        <span class="sq-card-title">定期活動会</span><span class="sq-card-arrow" aria-hidden="true">→</span>
      </a>
      <a class="sq-link-card" href="/stage">
        <img src="/static/images/home/card-stage.jpg" alt="Okayama Music SQUAREのイメージ">
        <span class="sq-card-title">Okayama Music SQUARE</span><span class="sq-card-arrow" aria-hidden="true">→</span>
      </a>
      <a class="sq-link-card" href="/bands">
        <img src="/static/images/home/card-bands.jpg" alt="バンド紹介">
        <span class="sq-card-title">バンド紹介</span><span class="sq-card-arrow" aria-hidden="true">→</span>
      </a>
      <a class="sq-link-card" href="/join">
        <img src="/static/images/home/card-join.jpg" alt="SQUAREへの入会案内">
        <span class="sq-card-title">入会について</span><span class="sq-card-arrow" aria-hidden="true">→</span>
      </a>
      <a class="sq-link-card" href="https://www.youtube.com/channel/UCpcjVaT57zyOhB92BROiTBA" target="_blank" rel="noopener noreferrer">
        <img src="/static/images/home/card-video.jpg" alt="動画撮影用カメラ">
        <span class="sq-card-title">活動の様子を動画で見る</span><span class="sq-card-arrow" aria-hidden="true">→</span>
      </a>
    </section>
  </main>
  <div data-site-footer></div>
</body>
</html>
